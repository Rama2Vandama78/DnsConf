name: Apply pinned rewrites

# 05:05 МСК (02:05 UTC) — ПОСЛЕ синка DnsConf (04:30, с запасом на Maven-сборку)
# и генерации списка (04:20). Ставит/чинит пины chatgpt+grok зон (вырезанных
# из списка), гигиена зон + мусор, проверяет живость IP и сам откатывается
# на запасной при необходимости.

on:
  schedule:
    - cron: '5 2 * * *'
  workflow_dispatch:

jobs:
  pins:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply pins
        run: python apply_pins.py
